---
- name: Ensure Docker is installed
  apt:
    name: docker.io
    state: present
    update_cache: yes

- name: Ensure Docker service is running
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Create Lighthouse directory for config
  file:
    path: /opt/lighthouse
    state: directory

- name: Create Lighthouse configuration
  copy:
    dest: /opt/lighthouse/lighthouse.conf
    content: |
      port = {{ lighthouse_port }}
      address = "0.0.0.0"
      clickhouse-url = "http://{{ clickhouse_host }}:{{ clickhouse_port }}"
      clickhouse-user = "{{ clickhouse_user }}"
      clickhouse-password = "{{ clickhouse_password }}"
      clickhouse-database = "{{ clickhouse_database }}"

- name: Pull Lighthouse Docker image
  docker_image:
    name: "{{ lighthouse_docker_image }}"
    source: pull

- name: Run Lighthouse container
  docker_container:
    name: lighthouse
    image: "{{ lighthouse_docker_image }}"
    state: started
    restart: yes
    ports:
      - "{{ lighthouse_container_port }}:8080"
    volumes:
      - /opt/lighthouse/lighthouse.conf:/etc/lighthouse/lighthouse.conf:ro
    command: "--config-file /etc/lighthouse/lighthouse.conf"

- name: Ensure nginx is installed
  apt:
    name: nginx
    state: present

- name: Configure nginx for Lighthouse
  copy:
    dest: /etc/nginx/sites-available/lighthouse
    content: |
      server {
          listen 80;
          server_name _;
          location / {
              proxy_pass http://127.0.0.1:{{ lighthouse_container_port }};
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
          }
      }

- name: Enable nginx site
  file:
    src: /etc/nginx/sites-available/lighthouse
    dest: /etc/nginx/sites-enabled/lighthouse
    state: link

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Restart nginx
  systemd:
    name: nginx
    state: restarted
